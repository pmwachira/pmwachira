name: Update Profile Stats

on:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC
  workflow_dispatch: {}     # allows manual trigger from the Actions tab

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute stats and update README
        env:
          # GITHUB_TOKEN only sees this repo — fine for nothing here, kept for repo checkout/push.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT scoped to "All repositories" / Contents: Read-only.
          # Required to see private repos and private contribution counts.
          STATS_PAT: ${{ secrets.STATS_PAT }}
          GH_USERNAME: pmwachira
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, re
          from collections import Counter

          username = os.environ["GH_USERNAME"]
          pat = os.environ["STATS_PAT"]

          def gh_rest(url):
              result = subprocess.run(
                  ["curl", "-s", "-H", f"Authorization: Bearer {pat}",
                   "-H", "Accept: application/vnd.github+json", url],
                  capture_output=True, text=True
              )
              data = json.loads(result.stdout)
              if isinstance(data, dict) and "message" in data:
                  raise RuntimeError(
                      f"GitHub API error calling {url}: {data.get('message')} "
                      f"(check that the STATS_PAT secret exists, is not expired, "
                      f"and has Contents:Read + Metadata:Read on all repos)"
                  )
              return data

          def gh_graphql(query, variables):
              payload = json.dumps({"query": query, "variables": variables})
              result = subprocess.run(
                  ["curl", "-s", "-X", "POST",
                   "-H", f"Authorization: Bearer {pat}",
                   "-H", "Content-Type: application/json",
                   "-d", payload,
                   "https://api.github.com/graphql"],
                  capture_output=True, text=True
              )
              data = json.loads(result.stdout)
              if "errors" in data:
                  raise RuntimeError(f"GraphQL error: {data['errors']}")
              if "data" not in data or data["data"] is None:
                  raise RuntimeError(f"Unexpected GraphQL response: {data}")
              return data

          if not pat:
              raise RuntimeError(
                  "STATS_PAT is empty — add it under Settings > Secrets and "
                  "variables > Actions in this repo."
              )

          # ---- Language breakdown (includes private repos, since PAT can see them) ----
          repos = gh_rest(f"https://api.github.com/user/repos?per_page=100&affiliation=owner")
          if not isinstance(repos, list):
              raise RuntimeError(f"Expected a list of repos, got: {repos}")
          totals = Counter()
          for repo in repos:
              if repo.get("fork"):
                  continue
              langs = gh_rest(repo["languages_url"])
              if isinstance(langs, dict):
                  for lang, bytes_ in langs.items():
                      totals[lang] += bytes_

          total_bytes = sum(totals.values()) or 1
          lang_rows = []
          for lang, count in totals.most_common(8):
              pct = 100 * count / total_bytes
              lang_rows.append(f"| {lang} | {pct:.1f}% |")
          lang_table = "| Language | Share |\n|---|---|\n" + "\n".join(lang_rows)

          # ---- Commit stats, including private contributions ----
          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                totalCommitContributions
                restrictedContributionsCount
                totalPullRequestContributions
                totalIssueContributions
              }
              repositories(privacy: PRIVATE, ownerAffiliations: OWNER) { totalCount }
              publicRepos: repositories(privacy: PUBLIC, ownerAffiliations: OWNER) { totalCount }
            }
          }
          """
          result = gh_graphql(query, {"login": username})
          contrib = result["data"]["user"]["contributionsCollection"]
          private_repo_count = result["data"]["user"]["repositories"]["totalCount"]
          public_repo_count = result["data"]["user"]["publicRepos"]["totalCount"]

          visible_commits = contrib["totalCommitContributions"]
          restricted_commits = contrib["restrictedContributionsCount"]
          total_commits = visible_commits + restricted_commits

          commit_table = (
              "| Metric | Count |\n"
              "|---|---|\n"
              f"| Commits (last year, incl. private) | {total_commits} |\n"
              f"| — visible commits | {visible_commits} |\n"
              f"| — restricted-repo commits | {restricted_commits} |\n"
              f"| Pull requests opened | {contrib['totalPullRequestContributions']} |\n"
              f"| Issues opened | {contrib['totalIssueContributions']} |\n"
              f"| Public repos | {public_repo_count} |\n"
              f"| Private repos | {private_repo_count} |"
          )

          readme = open("README.md").read()

          readme = re.sub(
              r"<!-- LANG-STATS:START -->.*?<!-- LANG-STATS:END -->",
              f"<!-- LANG-STATS:START -->\n{lang_table}\n<!-- LANG-STATS:END -->",
              readme, flags=re.DOTALL
          )
          readme = re.sub(
              r"<!-- COMMIT-STATS:START -->.*?<!-- COMMIT-STATS:END -->",
              f"<!-- COMMIT-STATS:START -->\n{commit_table}\n<!-- COMMIT-STATS:END -->",
              readme, flags=re.DOTALL
          )

          open("README.md", "w").write(readme)
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update profile stats"
          git push
